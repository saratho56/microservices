name: Microservices CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: SonarQube Analysis, Build and Push
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify Docker installation
      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      # 3. Check SonarQube availability
      - name: Check SonarQube availability
        run: |
          curl --fail --silent --show-error \
            http://54.79.216.91:9000/api/system/status

      # 4. Validate Docker Compose configuration
      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      # 5. Run SonarQube analysis
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://54.79.216.91:9000

      # 6. Build Docker images
      - name: Build Docker Images
        run: |
          docker compose build

      # 7. Display built images
      - name: List Docker Images
        run: |
          docker compose images
          docker image ls

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      # 9. Tag and push microservices images
      - name: Push Images to Docker Hub
        run: |
          set -euo pipefail

          DOCKER_REPO="saratho56/micro-services"

          for SERVICE in auth-service payment-service frontend; do
            SOURCE_IMAGE="microservices-${SERVICE}:latest"
            TARGET_IMAGE="${DOCKER_REPO}:${SERVICE}-latest"

            if ! docker image inspect "$SOURCE_IMAGE" >/dev/null 2>&1; then
              echo "ERROR: Image not found: $SOURCE_IMAGE"
              echo "Check the image names generated by docker compose build."
              docker image ls
              exit 1
            fi

            echo "Tagging $SOURCE_IMAGE as $TARGET_IMAGE"
            docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

            echo "Pushing $TARGET_IMAGE"
            docker push "$TARGET_IMAGE"
          done

      # 10. Logout from Docker Hub
      - name: Logout from Docker Hub
        if: always()
        run: |
          docker logout || true
