name: Build and Deploy Microservices

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      DOCKERHUB_USERNAME: saratho56
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: saratho56/micro-services:auth-${{ github.sha }}

      - name: Build and Push Payment Service
        uses: docker/build-push-action@v6
        with:
          context: ./payment-service
          push: true
          tags: saratho56/micro-services:payment-${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: saratho56/micro-services:frontend-${{ github.sha }}

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H 16.176.183.156 >> ~/.ssh/known_hosts

      - name: Deploy to Production
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            ubuntu@16.176.183.156 \
            "cd /opt/microservices && IMAGE_TAG=$IMAGE_TAG docker compose pull frontend auth-service payment-service && IMAGE_TAG=$IMAGE_TAG docker compose up -d frontend auth-service payment-service"

      - name: Verify Production Containers
        run: |
          ssh -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            ubuntu@16.176.183.156 \
            "docker ps"
