name: Microservices CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: SonarQube, Build, Push and Deploy
    runs-on: self-hosted

    env:
      DOCKER_REPO: saratho56/micro-services
      IMAGE_TAG: ${{ github.sha }}
      PROD_HOST: 16.176.183.156
      PROD_USER: ubuntu
      PROD_DIR: /opt/microservices

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify Docker
      - name: Verify Docker
        run: |
          set -euo pipefail
          docker --version
          docker compose version

      # 3. Check SonarQube
      - name: Check SonarQube
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            http://54.79.216.91:9000/api/system/status

      # 4. Validate runner Compose file
      - name: Validate Docker Compose
        run: |
          set -euo pipefail
          docker compose config --quiet

      # 5. SonarQube analysis
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://54.79.216.91:9000

      # 6. Build all four application images
      - name: Build Application Images
        run: |
          set -euo pipefail

          docker build \
            -f backend/auth_service/Dockerfile \
            -t "${DOCKER_REPO}:auth-service-${IMAGE_TAG}" .

          docker build \
            -f backend/payment_service/Dockerfile \
            -t "${DOCKER_REPO}:payment-service-${IMAGE_TAG}" .

          docker build \
            -f frontend/Dockerfile \
            -t "${DOCKER_REPO}:frontend-${IMAGE_TAG}" \
            ./frontend

          docker build \
            -f nginx/Dockerfile \
            -t "${DOCKER_REPO}:nginx-${IMAGE_TAG}" \
            ./nginx

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      # 8. Push versioned images
      - name: Push Application Images
        run: |
          set -euo pipefail

          for SERVICE in auth-service payment-service frontend nginx; do
            IMAGE="${DOCKER_REPO}:${SERVICE}-${IMAGE_TAG}"
            docker push "$IMAGE"
          done

      # 9. Configure production SSH
      - name: Configure Production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_KEY" \
            > "$HOME/.ssh/prod_key"

          chmod 600 "$HOME/.ssh/prod_key"

          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keyscan -H "$PROD_HOST" \
            >> "$HOME/.ssh/known_hosts"

      # 10. Verify production SSH
      - name: Test Production SSH
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/prod_key" \
            -o BatchMode=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "echo 'Production SSH connection successful'"

      # 11. Validate production Compose
      - name: Validate Production Compose
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "cd '$PROD_DIR' && \
             sudo env IMAGE_TAG='$IMAGE_TAG' \
             docker compose config --quiet"

      # 12. Pull new application images
      - name: Pull Production Images
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "cd '$PROD_DIR' && \
             sudo env IMAGE_TAG='$IMAGE_TAG' \
             docker compose pull \
             auth-service payment-service frontend nginx"

      # 13. Deploy application services
      - name: Deploy to Production
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "cd '$PROD_DIR' && \
             sudo env IMAGE_TAG='$IMAGE_TAG' \
             docker compose up -d --no-build \
             auth-service payment-service frontend nginx"

      # 14. Verify deployment
      - name: Verify Production Deployment
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/prod_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "cd '$PROD_DIR' && \
             sudo env IMAGE_TAG='$IMAGE_TAG' \
             docker compose ps"

          echo "Deployment completed."

      # 15. Cleanup SSH key
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f "$HOME/.ssh/prod_key"

      # 16. Logout from Docker Hub
      - name: Logout from Docker Hub
        if: always()
        run: |
          docker logout || true

