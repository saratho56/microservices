name: Build and Deploy Microservices

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: saratho56
  IMAGE_NAME: saratho56/micro-services

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: self-hosted

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Auth Service
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth_service
          push: true
          tags: saratho56/micro-services:auth-${{ github.sha }}

      # 5. Build and push Payment Service
      - name: Build and Push Payment Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/payment_service
          push: true
          tags: saratho56/micro-services:payment-${{ github.sha }}

      # 6. Build and push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: saratho56/micro-services:frontend-${{ github.sha }}

      # 7. Configure SSH
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
