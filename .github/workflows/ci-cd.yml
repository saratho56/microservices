name: Build and Deploy Microservices

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: self-hosted

    env:
      DOCKERHUB_USERNAME: saratho56
      IMAGE_TAG: ${{ github.sha }}
      PROD_HOST: 16.176.183.156
      PROD_USER: ubuntu

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify repository structure
      - name: Verify Dockerfiles
        run: |
          set -e

          test -f backend/auth_service/Dockerfile
          test -f backend/payment_service/Dockerfile
          test -f frontend/Dockerfile
          test -f docker-compose.yml

          echo "All required Dockerfiles and Compose file found."

      # 3. Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and push Auth Service
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth_service
          push: true
          tags: |
            sarath o/micro-services:auth-${{ github.sha }}

      # 6. Build and push Payment Service
      - name: Build and Push Payment Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/payment_service
          push: true
          tags: |
            sarath o/micro-services:payment-${{ github.sha }}

      # 7. Build and push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            sarath o/micro-services:frontend-${{ github.sha }}

      # 8. Prepare SSH
      - name: Configure Production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -eu

          install -d -m 700 ~/.ssh

          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key

          ssh-keygen -y -f ~/.ssh/production_key > /dev/null

          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      # 9. Deploy to production
      - name: Deploy to Production EC2
        run: |
          set -eu

          ssh \
            -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "mkdir -p /opt/microservices"

          scp \
            -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            docker-compose.yml \
            "$PROD_USER@$PROD_HOST:/opt/microservices/docker-compose.yml"

          ssh \
            -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "cd /opt/microservices && \
             export IMAGE_TAG='$IMAGE_TAG' && \
             export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' && \
             docker compose pull auth-service payment-service frontend && \
             docker compose up -d --no-build auth-service payment-service frontend"

      # 10. Verify production containers
      - name: Verify Production Deployment
        run: |
          set -eu

          ssh \
            -i ~/.ssh/production_key \
            -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

      # 11. Clean up SSH key
      - name: Clean Up SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/production_key
