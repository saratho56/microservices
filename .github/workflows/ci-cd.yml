name: Microservices CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SonarQube Analysis, Docker Build and Nexus Push
    runs-on: self-hosted

    env:
      NEXUS_HOST: ${{ secrets.NEXUS_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Check SonarQube availability
        run: |
          curl --fail --silent --show-error \
            http://54.79.216.91:9000/api/system/status

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://54.79.216.91:9000

      - name: Build Docker Images
        run: docker compose build

      - name: Login to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$NEXUS_PASSWORD" |
            docker login "http://${NEXUS_HOST}" \
              --username "$NEXUS_USERNAME" \
              --password-stdin

      - name: Tag and Push Images to Nexus
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          set -euo pipefail

          for service in auth-service payment-service frontend; do
            image_id=$(docker compose images -q "$service" | head -n 1)

            if [ -z "$image_id" ]; then
              echo "ERROR: No image found for service: $service"
              exit 1
            fi

            target_image="${NEXUS_HOST}/docker-hosted/${service}:${GITHUB_SHA}"

            docker tag "$image_id" "$target_image"
            docker push "$target_image"
          done

      - name: Logout from Nexus
        if: always()
        env:
          NEXUS_HOST: ${{ secrets.NEXUS_HOST }}
        run: |
          docker logout "http://${NEXUS_HOST}" || true

      - name: List Docker Images
        run: docker compose images

